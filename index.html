<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#090c12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="龙魂象棋" />
  <meta property="og:title" content="龙魂象棋 · XiangqiBlast" />
  <meta property="og:description" content="中国象棋内核的快节奏策略破阵小游戏，一盘3分钟！" />
  <meta property="og:type" content="website" />
  <title>XiangqiBlast</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="logos/logo_xiangqi_128.jpg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #090c12;
      font-family: "Noto Serif SC", "Noto Sans SC", "Songti SC", "Microsoft YaHei", serif; color: #e8e2d6;
      -webkit-user-select: none; user-select: none;
    }
    html[lang="en"] body {
      font-family: "Inter", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    canvas#pixi-canvas {
      position: fixed; top: 0; left: 0; z-index: 1;
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- DOM UI Layer -->
  <div id="ui-hud" class="ui-panel"></div>
  <div id="ui-hand" class="ui-panel"></div>
  <div id="ui-buttons" class="ui-panel"></div>
  <div id="ui-toast" class="ui-panel hidden"></div>
  <div id="ui-start-menu" class="ui-panel overlay hidden"></div>
  <div id="ui-victory" class="ui-panel overlay hidden"></div>
  <div id="ui-debug-modal" class="ui-panel overlay hidden"></div>
  <div id="ui-cloud-sync" class="ui-panel overlay hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
